    <rect x="482" y="573" width="236" height="60" fill="#F8FAFC"/>
    <g fill="#CBD5E1">
      <circle cx="530" cy="603" r="9"/><circle cx="600" cy="603" r="9"/><circle cx="670" cy="603" r="9"/>
    </g>
    <circle cx="530" cy="603" r="9" fill="#2563EB"/>
