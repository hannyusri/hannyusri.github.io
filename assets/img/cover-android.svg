<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Ilustrasi pengembangan aplikasi Android">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <pattern id="a-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#2563EB" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <clipPath id="a-screen"><rect x="482" y="117" width="236" height="516" rx="24"/></clipPath>
  </defs>

  <rect width="1200" height="750" fill="url(#a-bg)"/>
  <rect width="1200" height="750" fill="url(#a-grid)"/>

  <!-- kartu melayang kiri -->
  <g opacity=".95">
    <rect x="150" y="215" width="230" height="130" rx="16" fill="#fff" stroke="#DBEAFE"/>
    <rect x="174" y="243" width="34" height="34" rx="9" fill="#2563EB"/>
    <rect x="222" y="249" width="120" height="9" rx="4.5" fill="#CBD5E1"/>
